[project]
name = "tpu-perf-model"
version = "0.1.0"
description = "Analytical TPU GEMM model with reproducible v5e and v6e measurements"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "matplotlib>=3.10,<4",
    "numpy>=2.2,<3",
    "pyyaml>=6,<7",
]

[project.optional-dependencies]
# Collection is optional and exact: analysis never resolves a TPU wheel.
tpu = ["jax[tpu]==0.11.0"]

[dependency-groups]
dev = ["pytest>=8,<10"]

[project.scripts]
perfmodel = "cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
only-include = [
    "analysis.py",
    "benchmark.py",
    "cli.py",
    "evaluate.py",
    "figures.py",
    "hardware.py",
    "model.py",
    "shapes.py",
    "specs",
]
sources = ["."]

[tool.pytest.ini_options]
testpaths = ["tests"]
